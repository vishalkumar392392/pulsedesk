apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulsedesk
  namespace: ${NAMESPACE}
  labels:
    app: pulsedesk
  annotations:
    # Every application ingress in this group contributes rules to one ALB.
    alb.ingress.kubernetes.io/group.name: pulsedesk
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
    - host: api-pulsedesk.vishalpalla.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pulsedesk-service
                port:
                  number: 80
