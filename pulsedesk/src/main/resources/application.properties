spring.application.name=pulsedesk
server.port=${PULSEDESK_SERVER_PORT:80}

# AWS/deployed values should be supplied through environment variables.
# When they are absent, these values fall back to the local MySQL instance.
spring.datasource.url=${PULSEDESK_DB_URL:jdbc:mysql://localhost:3306/pulsedesk}
spring.datasource.username=${PULSEDESK_DB_USERNAME:root}
spring.datasource.password=${PULSEDESK_DB_PASSWORD:8143486643}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Logging
logging.level.com.pulsedesk=TRACE
#logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=DEBUG

#NEW_RELIC_DISTRIBUTED_TRACING_ENABLED=true

# ---------------- KAFKA ----------------

# AWS/deployed brokers should be supplied through the environment variable.
# When it is absent, Kafka falls back to the local brokers.
spring.kafka.bootstrap-servers=${PULSEDESK_KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9094}

#---------------- KAFKA PRODUCER ----------------
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
#spring.kafka.producer.retries=10
#spring.kafka.producer.properties.retry.backoff.ms=1000


spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.producer.properties.linger.ms=0
spring.kafka.producer.properties.request.timeout.ms=30000	


spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
