spring.application.name=pulsedesk
server.port=80
spring.datasource.url=jdbc:mysql://localhost:3306/pulsedesk
spring.datasource.username=root
spring.datasource.password=8143486643
#
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Logging
logging.level.com.pulsedesk=TRACE
#logging.level.org.springframework.security=TRACE
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=DEBUG

#NEW_RELIC_DISTRIBUTED_TRACING_ENABLED=true

# ---------------- KAFKA ----------------

# Common Kafka cluster address

spring.kafka.bootstrap-servers=3.145.127.180:9092,3.145.127.180:9094,3.145.127.180:9096

#---------------- KAFKA PRODUCER ----------------
#spring.kafka.producer.bootstrap-servers=localhost:9092,localhost:9094
#spring.kafka.producer.bootstrap-servers=3.145.127.180:9092,3.145.127.180:9094,3.145.127.180:9096
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
#spring.kafka.producer.retries=10
#spring.kafka.producer.properties.retry.backoff.ms=1000


spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.producer.properties.linger.ms=0
spring.kafka.producer.properties.request.timeout.ms=30000	


spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
