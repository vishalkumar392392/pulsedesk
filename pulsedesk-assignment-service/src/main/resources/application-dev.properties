spring.application.name=pulsedesk-assignment-service
server.port=${ASSIGNMENT_SERVICE_PORT:0}
pulsedesk.base-url=${PULSEDESK_BASE_URL:http://localhost:8080}

# AWS/deployed brokers should be supplied through the environment variable.
# When it is absent, Kafka falls back to the local brokers.
spring.kafka.bootstrap-servers=${PULSEDESK_KAFKA_BOOTSTRAP_SERVERS}

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.group-id=${PULSEDESK_ASSIGNMENT_GROUP_ID:pulsedesk-ticket-assignment-group}
